name: Scrape rankings

on:
  # 08:00/13:00/18:00/23:00 KST 예약 실행은 Cloudflare Worker(worker/index.js의 scheduled 핸들러,
  # wrangler.toml [triggers] crons)가 workflow_dispatch로 대신 트리거한다.
  # GitHub Actions 자체 cron은 부하가 많을 때 지연이 커서 쓰지 않음.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run musinsa scraper
        run: node scrape_musinsa.js

      - name: Run 29CM scraper
        run: node scrape_cm29.js

      # 랭킹에 새로 등장한 상품의 고정 속성(카테고리/핏/실측 사이즈/이미지 장수)을 받아둔다.
      # 이미 받은 상품은 건너뛰므로 평소엔 1,000건 미만, 1~2분이면 끝난다.
      # --limit은 어쩌다 대량 유입이 있어도 워크플로가 늘어지지 않게 하는 상한선이다.
      - name: Collect product metadata
        run: node scrape_product_meta.js --limit 3000

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: ranking snapshot"
            git push
          else
            echo "no data changes"
          fi
