name: Scrape rankings

on:
  # 08:00/13:00/18:00/23:00 KST 예약 실행은 Cloudflare Worker(worker/index.js의 scheduled 핸들러,
  # wrangler.toml [triggers] crons)가 workflow_dispatch로 트리거한다. Actions 자체 cron보다
  # 시각을 잘 지켜서 그쪽을 주 경로로 쓴다.
  workflow_dispatch: {}

  # 아래 schedule은 안전망이다. Worker가 쓰는 GitHub 토큰이 만료되면 dispatch가 401로 조용히
  # 실패하는데, 실행 자체가 안 생기니 Actions 화면에도 아무 흔적이 남지 않는다. 실제로 그렇게
  # 2026-09-10부터 6일간 수집이 멈춘 걸 뒤늦게 발견했다. Actions cron은 토큰이 필요 없으므로,
  # Worker가 죽어도 수집은 계속된다. 몇 분 지연될 수 있지만 하루 4회 스냅샷에는 문제없다.
  # 같은 시각에 Worker와 겹쳐 두 번 돌 수 있는데, 스냅샷 파일명이 분 단위라 덮어쓰기만 될 뿐이다.
  schedule:
    - cron: "5 23 * * *" # 08:05 KST
    - cron: "5 4 * * *"  # 13:05 KST
    - cron: "5 9 * * *"  # 18:05 KST
    - cron: "5 14 * * *" # 23:05 KST

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # package.json에 의존성이 생긴 뒤로 이 단계가 없으면 스크래퍼가 모듈을 못 찾고 죽는다
      # (실제로 sharp 도입 때 인스타 수집이 한 번 실패했다).
      - name: Install deps
        run: npm ci

      - name: Run musinsa scraper
        run: node scrape_musinsa.js

      - name: Run 29CM scraper
        run: node scrape_cm29.js

      # 랭킹에 새로 등장한 상품의 고정 속성(카테고리/핏/실측 사이즈/이미지 장수)을 받아둔다.
      # 이미 받은 상품은 건너뛰므로 평소엔 1,000건 미만, 1~2분이면 끝난다.
      # --limit은 어쩌다 대량 유입이 있어도 워크플로가 늘어지지 않게 하는 상한선이다.
      - name: Collect product metadata
        run: node scrape_product_meta.js --limit 3000

      # 자사 브랜드 카탈로그(비바라비다 419개)와 각 상품의 랭킹 진입 이력을 갱신한다.
      # 랭킹 스냅샷에는 TOP150만 있어서, 이게 있어야 브랜드 진단 패널에서
      # "올린 상품 중 몇 개가 실제로 랭킹에 들어갔나"를 볼 수 있다.
      - name: Collect brand catalog
        run: node scrape_brand_catalog.js

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: ranking snapshot"
            git push
          else
            echo "no data changes"
          fi
