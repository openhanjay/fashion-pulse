name: Scrape instagram

on:
  # 하루 1회, 09:00 KST(=00:00 UTC)에 실행. 상품 랭킹과 달리 순위 추이가 아니라 최근 게시물
  # 스냅샷만 필요해서 정확한 타이밍이 중요하지 않아, Cloudflare Worker 없이 GitHub Actions
  # 자체 cron을 그대로 사용한다.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run instagram scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scrape_instagram.js

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram/
          if ! git diff --cached --quiet; then
            git commit -m "chore: instagram snapshot"
            # 예약 실행과 계정 추가 즉시 트리거가 초 단위로 겹치면 push가 거절될 수 있어서,
            # 거절되면 최신 내용을 rebase로 받아온 뒤 다시 시도한다(최대 5번).
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "push 거절됨, rebase 후 재시도 ($i/5)"
              git pull --rebase origin main
            done
            echo "push를 여러 번 재시도했지만 실패했어요."
            exit 1
          else
            echo "no data changes"
          fi
