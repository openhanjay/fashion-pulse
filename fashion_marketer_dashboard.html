/* ---------------------------- 유틸: 시드 난수 ---------------------------- */
function seeded(seed) {
  const x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

/* ============================== 더미 데이터 ============================== */
const CATEGORIES = ["전체", "상의", "아우터", "바지", "원피스", "가방", "모자"];

const BRANDS_MUSINSA = ["커버낫","디스이즈네버댓","마디에크르디","앤더슨벨","인사일런스","와릴","파르티멘토","비바스튜디오","로우로우","내셔널지오그래픽","디스커버리","칼하트 WIP","스투시","폴로 랄프로렌","그루브라임"];

const PRODUCT_POOL = {
  전체: ["오버핏 반팔 티셔츠","플리스 집업 자켓","와이드 데님 팬츠","린넨 셔츠 원피스","크로스백 미니","자수 로고 볼캡"],
  상의: ["오버핏 반팔 티셔츠","스트라이프 니트 카라티","헤비웨이트 무지 반팔티","빈티지 워싱 셔츠","크루넥 스웨트셔츠","린넨 블렌드 셔츠"],
  아우터: ["플리스 집업 자켓","오버사이즈 블루종","나일론 코치자켓","무스탕 자켓","트러커 데님자켓","바람막이 아노락"],
  바지: ["와이드 데님 팬츠","밴딩 조거팬츠","세미와이드 슬랙스","카고 팬츠","코듀로이 팬츠","린넨 와이드 팬츠"],
  원피스: ["린넨 셔츠 원피스","니트 롱 원피스","플리츠 미디 원피스","스트랩 슬립 원피스","체크 셔츠 원피스","코튼 미니 원피스"],
  가방: ["크로스백 미니","캔버스 에코백","버킷 파우치백","레더 숄더백","나일론 백팩","웨빙 벨트백"],
  모자: ["자수 로고 볼캡","코듀로이 버킷햇","울 니트 비니","스트랩백 캡","뉴에라 볼캡","리넨 버킷햇"],
};

const MOCK_TOP_N = 150;

function generateRanking(category, catIdx, brandsList, seedBase) {
  const pool = PRODUCT_POOL[category];
  return Array.from({ length: MOCK_TOP_N }, (_, i) => {
    const seed = seedBase + catIdx * 977 + i * 13 + 1;
    const brand = brandsList[Math.floor(seeded(seed) * brandsList.length)];
    const name = pool[(i + catIdx) % pool.length];
    const price = Math.round(((19000 + seeded(seed + 1) * 170000) / 1000)) * 1000;
    const roll = seeded(seed + 2);
    let delta;
    if (i < 5 && roll > 0.72) delta = "NEW";
    else delta = Math.round((seeded(seed + 3) - 0.45) * 26);
    return { rank: i + 1, brand, name, price, delta };
  });
}

function buildPlatformRankings(brandsList, seedBase) {
  return Object.fromEntries(CATEGORIES.map((c, idx) => [c, generateRanking(c, idx, brandsList, seedBase)]));
}

/* 목업 랭킹(단일 리스트 + delta)을 실데이터와 동일한 { all, rising, new } 구조로 변환 */
function toFilteredRankings(rawRankings) {
  return Object.fromEntries(CATEGORIES.map((c) => {
    const list = rawRankings[c];
    return [c, {
      all: list,
      rising: list.filter((item) => typeof item.delta === "number" && item.delta > 0),
      new: list.filter((item) => item.delta === "NEW"),
    }];
  }));
}

const MUSINSA_MOCK_RANKINGS = toFilteredRankings(buildPlatformRankings(BRANDS_MUSINSA, 0));

/* Date -> "YYYY-MM-DD" (수집 인덱스/파일명 키와 맞춤) */
function formatDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function parseDateKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}

/* 하루 여러 번 수집한 스냅샷들을 상품별 평균 순위로 합쳐서 하나의 { all, rising, new } 랭킹으로 재구성 */
function averageRankings(snapshots) {
  const result = {};
  CATEGORIES.forEach((cat) => {
    result[cat] = {};
    ["all", "rising", "new"].forEach((filterKey) => {
      const merged = new Map();
      snapshots.forEach((snap) => {
        const list = snap?.[cat]?.[filterKey] || [];
        list.forEach((item) => {
          const key = item.url || `${item.brand}__${item.name}`;
          const existing = merged.get(key);
          if (existing) {
            existing.sumRank += item.rank;
            existing.count += 1;
            existing.latest = item;
          } else {
            merged.set(key, { sumRank: item.rank, count: 1, latest: item });
          }
        });
      });
      result[cat][filterKey] = [...merged.values()]
        .map((v) => { const { delta, ...rest } = v.latest; return { ...rest, avgRank: v.sumRank / v.count }; })
        .sort((a, b) => a.avgRank - b.avgRank)
        .slice(0, 150)
        .map((item, idx) => ({ ...item, rank: idx + 1 }));
    });
  });
  return result;
}

/* 검색어 랭킹 스냅샷들을 검색어별 평균 순위로 합침 (카테고리 구분 없음, all/rising 2종) */
function averageKeywordRankings(snapshots) {
  const result = {};
  ["all", "rising"].forEach((filterKey) => {
    const merged = new Map();
    snapshots.forEach((snap) => {
      const list = snap?.keywords?.[filterKey] || [];
      list.forEach((item) => {
        const key = item.url || item.keyword;
        const existing = merged.get(key);
        if (existing) {
          existing.sumRank += item.rank;
          existing.count += 1;
          existing.latest = item;
        } else {
          merged.set(key, { sumRank: item.rank, count: 1, latest: item });
        }
      });
    });
    result[filterKey] = [...merged.values()]
      .map((v) => { const { delta, ...rest } = v.latest; return { ...rest, avgRank: v.sumRank / v.count }; })
      .sort((a, b) => a.avgRank - b.avgRank)
      .slice(0, 100)
      .map((item, idx) => ({ ...item, rank: idx + 1 }));
  });
  return result;
}

/* 오늘의 평균 랭킹(today)에, 전일 평균 랭킹(prior) 대비 순위가 몇 계단 올랐는지/내렸는지를 매긴다.
   전일 평균에 없던 상품은 "NEW". today/prior는 { [catKey]: { [filterKey]: [items] } } 형태(카테고리든 "keywords" 같은 가상 키든 동일하게 동작). */
function attachAverageDelta(today, prior, catKeys, filterKeys) {
  catKeys.forEach((cat) => {
    filterKeys.forEach((filterKey) => {
      const priorList = prior?.[cat]?.[filterKey] || [];
      const priorRankByUrl = new Map(priorList.filter((it) => it.url).map((it) => [it.url, it.rank]));
      today[cat][filterKey] = (today[cat][filterKey] || []).map((item) => {
        if (!item.url || !priorRankByUrl.has(item.url)) return { ...item, delta: "NEW" };
        return { ...item, delta: priorRankByUrl.get(item.url) - item.rank };
      });
    });
  });
  return today;
}

/* index({"YYYY-MM-DD":["HH-mm",...]})에서 (dateStr, rawTime) 바로 직전 수집 시점을 찾는다.
   scrape_musinsa.js/scrape_cm29.js의 findLatestPriorSnapshot과 동일한 규칙
   (같은 날 이전 시각이 있으면 그중 가장 늦은 시각, 없으면 이전 날짜의 마지막 시각). */
function findPriorSnapshotEntry(index, dateStr, rawTime) {
  const sameDayEarlier = (index[dateStr] || []).filter((t) => t < rawTime).sort();
  if (sameDayEarlier.length) return { date: dateStr, time: sameDayEarlier[sameDayEarlier.length - 1] };
  const priorDates = Object.keys(index || {}).filter((d) => d < dateStr).sort();
  const priorDate = priorDates[priorDates.length - 1];
  if (!priorDate) return null;
  const priorTimes = index[priorDate] || [];
  if (!priorTimes.length) return null;
  return { date: priorDate, time: priorTimes[priorTimes.length - 1] };
}

/* 29CM 스냅샷들(대분류 > 서브카테고리 > 기간 3단계 구조)을 상품별 평균 순위로 합침.
   카테고리 구조를 하드코딩하지 않고 스냅샷에 실제로 들어있는 키들을 그대로 순회한다.
   popularKeywords는 대분류가 아니라 스냅샷 최상위에 같이 들어있는 별개의 필드(인기 검색어 TOP10)라서 제외. */
function averageCm29Rankings(snapshots) {
  const result = {};
  const largeCats = new Set();
  snapshots.forEach((s) => Object.keys(s || {}).forEach((k) => { if (k !== "popularKeywords") largeCats.add(k); }));
  largeCats.forEach((largeCat) => {
    result[largeCat] = {};
    const subCats = new Set();
    snapshots.forEach((s) => Object.keys(s?.[largeCat] || {}).forEach((k) => subCats.add(k)));
    subCats.forEach((subCat) => {
      result[largeCat][subCat] = {};
      const periods = new Set();
      snapshots.forEach((s) => Object.keys(s?.[largeCat]?.[subCat] || {}).forEach((k) => periods.add(k)));
      periods.forEach((period) => {
        const merged = new Map();
        snapshots.forEach((snap) => {
          const list = snap?.[largeCat]?.[subCat]?.[period] || [];
          list.forEach((item) => {
            const key = item.url || `${item.brand}__${item.name}`;
            const existing = merged.get(key);
            if (existing) {
              existing.sumRank += item.rank;
              existing.count += 1;
              existing.latest = item;
            } else {
              merged.set(key, { sumRank: item.rank, count: 1, latest: item });
            }
          });
        });
        result[largeCat][subCat][period] = [...merged.values()]
          .map((v) => { const { delta, ...rest } = v.latest; return { ...rest, avgRank: v.sumRank / v.count }; })
          .sort((a, b) => a.avgRank - b.avgRank)
          .slice(0, 100)
          .map((item, idx) => ({ ...item, rank: idx + 1 }));
      });
    });
  });
  return result;
}

/* 검색어 순위 추이 그래프. rows는 개수가 고정이 아니고(그 주에 한 번이라도 TOP N이었던 만큼 유동적).
   순위 밖으로 빠진 날(또는 추적 범위인 rankMax보다 낮은 순위였던 날)은 선을 끊는 대신 그래프 아래쪽
   "순위밖" 구간에 점을 찍어서 계속 이어 그린다(그날도 동그라미가 남아있도록).
   각 선이 실제로 TOP N 안에 들었던 첫 지점과 마지막 지점 위에 검색어 이름을 적어준다
   (순위밖 구간에 있는 동안은 라벨을 붙이지 않음). */
function KeywordTrendGraph({ dates, rows, rankMax = 7 }) {
  const width = 700, height = 260;
  const padL = 26, padR = 20, padT = 30, padB = 26;
  const innerW = width - padL - padR;
  const RANK_MAX = rankMax;
  const rankZoneH = (height - padT - padB) * 0.76;
  const outBaseY = padT + rankZoneH + 22;
  const outStep = 11;
  const n = dates.length;
  const xFor = (i) => padL + (n > 1 ? (i / (n - 1)) * innerW : innerW / 2);
  const yForRank = (rank) => padT + ((rank - 1) / (RANK_MAX - 1)) * rankZoneH;
  const shortLabel = (s) => (s.length > 8 ? `${s.slice(0, 7)}…` : s);
  const isRanked = (r) => typeof r === "number" && r <= RANK_MAX;

  let outSlot = 0;
  const rowsWithPoints = rows.map((row) => {
    const firstSeen = row.ranksByDay.findIndex((r) => typeof r === "number");
    const outOnLastDay = firstSeen !== -1 && !isRanked(row.ranksByDay[row.ranksByDay.length - 1]);
    const myOutY = outOnLastDay ? outBaseY + outSlot++ * outStep : outBaseY;
    const points = row.ranksByDay.map((rank, i) => {
      if (firstSeen === -1 || i < firstSeen) return null;
      if (isRanked(rank)) return { x: xFor(i), y: yForRank(rank), ranked: true };
      return { x: xFor(i), y: myOutY, ranked: false };
    });
    const rankedIdxs = points.map((p, i) => (p && p.ranked ? i : null)).filter((v) => v !== null);
    return { ...row, points, firstRankedIdx: rankedIdxs[0] ?? null, lastRankedIdx: rankedIdxs.length ? rankedIdxs[rankedIdxs.length - 1] : null };
  });

  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height="100%" preserveAspectRatio="none">
      {Array.from({ length: RANK_MAX }, (_, i) => i + 1).map((rank) => {
        const y = yForRank(rank);
        return (
          <g key={rank}>
            <line x1={padL} x2={width - padR} y1={y} y2={y} stroke={C.line} strokeDasharray="3 5" />
            <text x={padL - 6} y={y + 3} fontSize="10" fill={C.mute} textAnchor="end">{rank}</text>
          </g>
        );
      })}
      <line x1={padL} x2={width - padR} y1={outBaseY} y2={outBaseY} stroke={C.line} strokeDasharray="2 4" />
      <text x={padL - 6} y={outBaseY + 3} fontSize="9" fill={C.mute} textAnchor="end">순위밖</text>
      {dates.map((d, i) => (<text key={d} x={xFor(i)} y={height - 6} fontSize="10" fill={C.mute} textAnchor="middle">{d.slice(5)}</text>))}
      {rowsWithPoints.map((row, ri) => {
        const color = LINE_PALETTE[ri % LINE_PALETTE.length];
        const present = row.points.map((p, i) => (p ? { ...p, i } : null)).filter(Boolean);
        const anchorFor = (i) => (i === 0 ? "start" : i === n - 1 ? "end" : "middle");
        const rankedLabelIdxs = [row.firstRankedIdx, row.lastRankedIdx].filter((v, i, arr) => v !== null && arr.indexOf(v) === i);
        // 관심 검색어로 직접 추가한 키워드는 한 주 내내 순위 안(top N)에 못 들 수도 있는데, 그래도 어떤 선인지는
        // 알아볼 수 있어야 하니 순위 안 지점이 하나도 없으면 순위밖 지점 중 첫/마지막에라도 라벨을 붙인다.
        const labelIdxs = rankedLabelIdxs.length
          ? rankedLabelIdxs
          : [present[0]?.i, present[present.length - 1]?.i].filter((v, i, arr) => v !== undefined && arr.indexOf(v) === i);
        return (
          <g key={row.key}>
            {present.length > 1 && (<polyline points={present.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" opacity="0.85" />)}
            {present.map((p, pi) => (<circle key={pi} cx={p.x} cy={p.y} r={p.ranked ? 3.2 : 3} fill={p.ranked ? color : C.white} stroke={color} strokeWidth={p.ranked ? 0 : 1.5} />))}
            {labelIdxs.map((idx) => {
              const delta = row.deltasByDay?.[idx];
              const deltaText = delta === undefined ? null : delta === "NEW" ? "NEW" : delta === 0 ? "0" : delta > 0 ? `+${delta}` : `${delta}`;
              return (
                <text key={idx} x={row.points[idx].x} y={row.points[idx].y - 9} fontSize="10.5" fontWeight="700" fill={color} textAnchor={anchorFor(idx)}>
                  {shortLabel(row.keyword)}
                  {!!deltaText && (<tspan fontSize="9" dx="3">{deltaText}</tspan>)}
                </text>
              );
            })}
          </g>
        );
      })}
    </svg>
  );
}

function DeltaBadge({ delta }) {
  if (delta === "NEW") return (<span className="text-[12px] font-bold px-1.5 py-0.5 rounded" style={{ background: C.signal, color: C.white }}>NEW</span>);
  if (delta > 0) return (<span className="flex items-center gap-0.5 text-[13px] font-bold" style={{ color: "#1E8E5A" }}><TrendingUp size={13} /> {delta}</span>);
  if (delta < 0) return (<span className="flex items-center gap-0.5 text-[13px] font-bold" style={{ color: C.signal }}><TrendingDown size={13} /> {Math.abs(delta)}</span>);
  return (<span className="flex items-center gap-0.5 text-[13px] font-semibold" style={{ color: C.mute }}><Minus size={13} /> 0</span>);
}

function CompactDelta({ delta }) {
  if (delta === undefined) return null;
  if (delta === "NEW") return (<span className="text-[12px] font-bold shrink-0" style={{ color: C.signal }}>NEW</span>);
  if (delta > 0) return (<span className="flex items-center gap-0.5 text-[12px] font-bold shrink-0" style={{ color: "#1E8E5A" }}><TrendingUp size={11} />{delta}</span>);
  if (delta < 0) return (<span className="flex items-center gap-0.5 text-[12px] font-bold shrink-0" style={{ color: C.signal }}><TrendingDown size={11} />{Math.abs(delta)}</span>);
  return (<span className="text-[12px] font-semibold shrink-0" style={{ color: C.mute }}>-</span>);
}

const KEYWORD_FILTERS = [{ key: "all", label: "전체" }, { key: "rising", label: "급상승" }];
const KEYWORD_TOP_N_DISPLAY = 80;
const KEYWORD_TREND_TOP_N = 7;

/* 날짜(dateKey)의 그 날 전체 수집 시각을 평균 내서 그 날의 "전체" 검색어 랭킹을 하나 만든다 */
async function fetchKeywordDateAverage(dateKey, times) {
  const snapshots = await Promise.all(
    times.map((t) => fetch(`data/musinsa_${dateKey}_${t}.json`).then((res) => { if (!res.ok) throw new Error("no snapshot file"); return res.json(); }))
  );
  return averageKeywordRankings(snapshots).all;
}

/* perDay(날짜별 "그날 전체 순위" 리스트, rank 오름차순)로부터 그래프/표에 쓸 rows를 만든다.
   그중 하루라도 TOP N(topN)에 들었던 검색어를 전부 모으고, 각 날짜별 실제 순위(ranksByDay, TOP N 밖이어도
   랭킹 리스트에 있었으면 그 순위를 그대로 채움 - "-"가 되는 건 그 날 리스트에 아예 없었을 때뿐)와
   전날 대비 변동(deltasByDay: 첫 날이거나 그 날 순위 자체가 없으면 undefined, 전날에 없었으면 "NEW")을
   같이 계산한다. Musinsa 검색어/29CM 인기 검색어 둘 다 이 함수를 공유한다. */
/* perDay 안에서 특정 key(url 또는 검색어 문자열)에 해당하는 한 행(row)만 만든다. TOP N 여부와 무관하게,
   그 주에 단 하루라도 데이터에 있었으면(순위 몇 등이든) 행을 만들어준다 - "관심 검색어"로 직접 추가한
   키워드는 TOP N에 들지 않아도 계속 추적할 수 있어야 하기 때문. 그 주 내내 한 번도 없었으면 null. */
function buildKeywordTrendRow(perDay, key) {
  const ranksByDay = perDay.map((dayList) => {
    const found = dayList.find((item) => (item.url || item.keyword) === key);
    return found ? found.rank : null;
  });
  if (ranksByDay.every((r) => r === null)) return null;
  const keywordItem = perDay.flat().find((item) => (item.url || item.keyword) === key);
  const deltasByDay = ranksByDay.map((rank, i) => {
    if (i === 0 || rank === null) return undefined;
    const prevRank = ranksByDay[i - 1];
    return prevRank === null ? "NEW" : prevRank - rank;
  });
  return { key, keyword: keywordItem.keyword, ranksByDay, deltasByDay };
}

/* perDay 안에서 하루라도 등장한 적 있는 모든 검색어 후보(관심 검색어 입력 자동완성용) 목록을 만든다. */
function allKeywordCandidates(perDay) {
  const map = new Map();
  (perDay || []).forEach((dayList) => {
    dayList.forEach((item) => {
      const key = item.url || item.keyword;
      if (!map.has(key)) map.set(key, item.keyword);
    });
  });
  return [...map.entries()].map(([key, keyword]) => ({ key, keyword }));
}

function buildKeywordTrendRows(perDay, topN) {
  const keywordMeta = new Map(); // key -> { keyword, lastSeenDayIndex }
  perDay.forEach((dayList, di) => {
    dayList.slice(0, topN).forEach((item) => {
      const key = item.url || item.keyword;
      keywordMeta.set(key, { keyword: item.keyword, lastSeenDayIndex: di });
    });
  });

  const todayList = perDay[perDay.length - 1];
  const todayRankByKey = new Map(todayList.map((item) => [item.url || item.keyword, item.rank]));

  return [...keywordMeta.entries()]
    .map(([key, meta]) => {
      const row = buildKeywordTrendRow(perDay, key);
      return {
        ...row,
        todayRank: todayRankByKey.has(key) ? todayRankByKey.get(key) : null,
        lastSeenDayIndex: meta.lastSeenDayIndex,
      };
    })
    .sort((a, b) => {
      if (a.todayRank !== null && b.todayRank !== null) return a.todayRank - b.todayRank;
      if (a.todayRank !== null) return -1;
      if (b.todayRank !== null) return 1;
      return b.lastSeenDayIndex - a.lastSeenDayIndex;
    });
}

/* 선택한 날짜까지 중 최근 7개 수집일의 "전체" 검색어 랭킹을 모아서, 그중 하루라도 TOP 7에 들었던
   검색어를 전부 모은 표를 만든다(어제 7위였던 게 오늘 안 보이는 일이 없도록, 최신일 순위만 보지 않음). */
async function loadKeywordWeekTrend(musinsaIndex, selectedDateKey) {
  const availableDates = Object.keys(musinsaIndex || {}).filter((d) => d <= selectedDateKey).sort();
  const last7 = availableDates.slice(-7);
  if (last7.length === 0) return null;
  const perDay = await Promise.all(last7.map((d) => fetchKeywordDateAverage(d, musinsaIndex[d])));
  const rows = buildKeywordTrendRows(perDay, KEYWORD_TREND_TOP_N);
  return { dates: last7, rows, perDay };
}

/* 검색어 랭킹 패널 자체의 시간 선택(상품 랭킹 패널과 독립적)에 쓰는 로더. "평균"은 당일 평균 vs 전일 평균,
   특정 시각은 그 시각의 스냅샷에 이미 붙어있는 delta(스크랩 시점에 계산됨)를 그대로 사용한다. */
/* validTimes: rawTimes 중 실제로 검색어(keywords) 데이터가 들어있는 시각만 골라서 같이 돌려준다.
   (검색어 수집 기능이 나중에 추가된 날은 그 이전 시각 스냅샷엔 keywords 필드 자체가 없어서, 그 시각을
   시간 선택 버튼에서 아예 빼기 위함.) */
async function loadMusinsaKeywordSnapshot(musinsaIndex, dateKey, rawTimes, timeLabel) {
  const fetchOne = (dKey, rawTime) => fetch(`data/musinsa_${dKey}_${rawTime}.json`).then((res) => { if (!res.ok) throw new Error("no snapshot file"); return res.json(); });
  if (timeLabel === "평균") {
    const todaySnapshots = await Promise.all(rawTimes.map((t) => fetchOne(dateKey, t)));
    const validTimes = rawTimes.filter((t, i) => !!todaySnapshots[i]?.keywords);
    const todayKeywordAvg = averageKeywordRankings(todaySnapshots);
    const priorDates = Object.keys(musinsaIndex || {}).filter((d) => d < dateKey).sort();
    const priorDateKey = priorDates[priorDates.length - 1];
    if (!priorDateKey) return { data: todayKeywordAvg, validTimes };
    const priorTimes = musinsaIndex[priorDateKey] || [];
    const priorSnapshots = await Promise.all(priorTimes.map((t) => fetchOne(priorDateKey, t)));
    const priorKeywordAvg = averageKeywordRankings(priorSnapshots);
    const data = attachAverageDelta({ keywords: todayKeywordAvg }, { keywords: priorKeywordAvg }, ["keywords"], ["all", "rising"]).keywords;
    return { data, validTimes };
  }
  const data = await fetchOne(dateKey, timeLabel.replace(":", "-"));
  return { data: data.keywords || { all: [], rising: [] }, validTimes: null };
}

function KeywordRankingPanel({ dataSource, selectedDateLabel, musinsaIndex, selectedDateKey }) {
  const [mode, setMode] = useState("list");
  const [filter, setFilter] = useState("all");
  const [visibleCount, setVisibleCount] = useState(20);
  const [trend, setTrend] = useState({ status: "idle" });
  const [kwTime, setKwTime] = useState("평균");
  const [kwData, setKwData] = useState({ all: [], rising: [] });
  const [validKwTimes, setValidKwTimes] = useState([]);
  const [trendView, setTrendView] = useState("graph");
  const [watchList, setWatchList] = useState([]); // 관심 검색어로 직접 추가한 { key, keyword } 목록
  const [watchInput, setWatchInput] = useState("");
  const [watchError, setWatchError] = useState("");

  useEffect(() => {
    if ((mode !== "trend" && mode !== "watch") || !musinsaIndex || !selectedDateKey) return;
    let cancelled = false;
    setTrend({ status: "loading" });
    loadKeywordWeekTrend(musinsaIndex, selectedDateKey)
      .then((result) => { if (!cancelled) setTrend(result ? { status: "ready", ...result } : { status: "empty" }); })
      .catch(() => { if (!cancelled) setTrend({ status: "error" }); });
    return () => { cancelled = true; };
  }, [mode, musinsaIndex, selectedDateKey]);

  const addWatchKeyword = () => {
    const text = watchInput.trim();
    if (!text || trend.status !== "ready") return;
    const candidates = allKeywordCandidates(trend.perDay);
    const match = candidates.find((c) => c.keyword === text) || candidates.find((c) => c.keyword.includes(text));
    if (!match) { setWatchError("이번 주 데이터에서 찾을 수 없어요."); return; }
    setWatchError("");
    setWatchInput("");
    if (!watchList.some((w) => w.key === match.key)) setWatchList((prev) => [...prev, match]);
  };
  const removeWatchKeyword = (key) => setWatchList((prev) => prev.filter((w) => w.key !== key));

  const watchRows = useMemo(() => {
    if (trend.status !== "ready") return [];
    return watchList.map((w) => buildKeywordTrendRow(trend.perDay, w.key)).filter(Boolean);
  }, [trend, watchList]);

  const availableKwTimes = validKwTimes.length ? ["평균", ...validKwTimes.map((t) => t.replace("-", ":"))] : [];

  useEffect(() => {
    if (mode !== "list" || !musinsaIndex || !selectedDateKey) return;
    const rawTimes = musinsaIndex[selectedDateKey] || [];
    if (!rawTimes.length) { setKwData({ all: [], rising: [] }); setValidKwTimes([]); return; }
    let cancelled = false;
    setKwTime("평균");
    loadMusinsaKeywordSnapshot(musinsaIndex, selectedDateKey, rawTimes, "평균")
      .then(({ data, validTimes }) => { if (!cancelled) { setKwData(data); setValidKwTimes(validTimes || []); } })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [mode, musinsaIndex, selectedDateKey]);

  const onSelectKwTime = (t) => {
    const rawTimes = musinsaIndex?.[selectedDateKey] || [];
    setKwTime(t);
    loadMusinsaKeywordSnapshot(musinsaIndex, selectedDateKey, rawTimes, t).then(({ data }) => setKwData(data)).catch(() => {});
  };

  return (
    <div className="rounded-2xl p-5 h-full flex flex-col" style={{ background: C.white, border: `1px solid ${C.line}` }}>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div className="flex items-center gap-2">
          <Sparkles size={16} color={C.indigo} />
          <h2 className="text-base font-bold" style={{ color: C.ink }}>무신사 검색어 랭킹</h2>
          {dataSource !== "live" && (<span className="text-[10.5px] font-semibold px-1.5 py-0.5 rounded" style={{ background: C.paper, color: C.mute }}>샘플 데이터</span>)}
        </div>
        <div className="flex items-center gap-2">
          {!!selectedDateLabel && (<span className="text-xs font-medium whitespace-nowrap" style={{ color: C.mute }}>{selectedDateLabel}</span>)}
          <button onClick={() => setMode((m) => (m === "trend" ? "list" : "trend"))} className="text-xs font-bold px-3 py-1.5 rounded-full whitespace-nowrap" style={{ background: mode === "trend" ? C.ink : C.paper, color: mode === "trend" ? C.white : C.mute, border: `1px solid ${mode === "trend" ? C.ink : C.line}` }}>최근 1주일</button>
          <button onClick={() => setMode((m) => (m === "watch" ? "list" : "watch"))} className="text-xs font-bold px-3 py-1.5 rounded-full whitespace-nowrap" style={{ background: mode === "watch" ? C.ink : C.paper, color: mode === "watch" ? C.white : C.mute, border: `1px solid ${mode === "watch" ? C.ink : C.line}` }}>관심{watchList.length ? ` (${watchList.length})` : ""}</button>
        </div>
      </div>
      {mode === "list" ? (
        <div className="flex-1 min-h-0 flex flex-col">
          {!!availableKwTimes.length && (
            <div className="flex items-center gap-1.5 mb-3 overflow-x-auto pb-1">
              {availableKwTimes.map((t) => {
                const isActive = t === kwTime;
                return (<button key={t} onClick={() => onSelectKwTime(t)} className="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap transition-colors" style={{ background: isActive ? C.ink : C.paper, color: isActive ? C.white : C.mute, border: `1px solid ${isActive ? C.ink : C.line}` }}>{t}</button>);
              })}

            {KEYWORD_FILTERS.map((f, i) => {
              const isActive = f.key === filter;
              const prevActive = i > 0 && KEYWORD_FILTERS[i - 1].key === filter;
              return (<button key={f.key} onClick={() => { setFilter(f.key); setVisibleCount(20); }} className="px-4 py-1.5 text-xs font-bold transition-all" style={{ background: isActive ? C.ink : "transparent", color: isActive ? C.white : C.mute, borderRadius: 6, borderLeft: i > 0 && !isActive && !prevActive ? `1px solid ${C.line}` : "1px solid transparent" }}>{f.label}</button>);

            return (

                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-x-4">

                    <a key={item.url || item.keyword} href={item.url || undefined} target="_blank" rel="noreferrer" className="flex items-center gap-2 py-1.5 text-xs" style={{ borderBottom: `1px solid ${C.line}` }}>
                      <span className="w-5 shrink-0 font-bold tabular-nums text-right" style={{ color: C.mute }}>{item.rank}</span>
                      <span className="flex-1 truncate font-semibold" style={{ color: C.ink, fontSize: 14 }}>{item.keyword}</span>
                      <CompactDelta delta={item.delta} />
                    </a>
                  ))}
                </div>
                {fullList.length > 20 && (
                  <div className="flex justify-center mt-3">
                    {visibleCount < fullList.length ? (

/* 29CM은 검색어 순위/등락 데이터가 따로 없고 인기 검색어 TOP 10 리스트만 있다. 등락 표시는
   비교 대상 스냅샷(평균이면 전일 평균, 특정 시각이면 바로 직전 수집 시점)과 이 화면에서 직접 계산한다
   (같은 키워드가 있으면 순위 차이, 없으면 NEW). */

const CM29_KEYWORD_TREND_TOP_N = 5; // 최근 1주일 추이(그래프/표)는 TOP 5까지만 표시

/* 그 날 수집된 모든 시점의 인기 검색어(TOP10, URL 없이 문자열만) 순위를 평균 내서 하루치 랭킹으로 합침 */
function averageCm29PopularKeywords(snapshots) {
  const merged = new Map();
  snapshots.forEach((snap) => {
    (snap?.popularKeywords || []).forEach((kw, i) => {
      const rank = i + 1;
      const existing = merged.get(kw);
      if (existing) { existing.sumRank += rank; existing.count += 1; }
      else { merged.set(kw, { sumRank: rank, count: 1 }); }
    });
  });
  return [...merged.entries()]
    .map(([keyword, v]) => ({ keyword, avgRank: v.sumRank / v.count }))
    .sort((a, b) => a.avgRank - b.avgRank)
    .map((item, idx) => ({ ...item, rank: idx + 1 }));
}

async function fetchCm29KeywordDateAverage(dateKey, times) {
  const snapshots = await Promise.all(
    times.map((t) => fetch(`data/cm29_${dateKey}_${t}.json`).then((res) => { if (!res.ok) throw new Error("no snapshot file"); return res.json(); }))
  );
  return averageCm29PopularKeywords(snapshots);
}

/* Musinsa 검색어 추이(loadKeywordWeekTrend)와 동일한 규칙으로 29CM 인기 검색어의 최근 7개 수집일 추이를 만든다. */
async function loadCm29KeywordWeekTrend(cm29Index, selectedDateKey) {
  const availableDates = Object.keys(cm29Index || {}).filter((d) => d <= selectedDateKey).sort();
  const last7 = availableDates.slice(-7);
  if (last7.length === 0) return null;
  const perDay = await Promise.all(last7.map((d) => fetchCm29KeywordDateAverage(d, cm29Index[d])));
  const rows = buildKeywordTrendRows(perDay, CM29_KEYWORD_TREND_TOP_N);
  return { dates: last7, rows, perDay };
}

/* 검색어 랭킹 패널 자체의 시간 선택(상품 랭킹 패널과 독립적)에 쓰는 로더. "평균"은 당일 평균 vs 전일 평균,
   특정 시각은 그 시각의 스냅샷 vs 바로 직전 수집 시점을 비교해서 등락을 직접 계산한다
   (29CM 인기 검색어는 스크래퍼가 delta를 안 붙여줌).
   validTimes: rawTimes 중 실제로 popularKeywords 데이터가 들어있는 시각만 골라서 같이 돌려준다
   (인기 검색어 수집 기능이 나중에 추가된 날은 그 이전 시각 스냅샷엔 popularKeywords가 아예 없어서,
   그 시각을 시간 선택 버튼에서 빼기 위함). */
async function loadCm29KeywordSnapshot(cm29Index, dateKey, rawTimes, timeLabel) {
  const fetchOne = (dKey, rawTime) => fetch(`data/cm29_${dKey}_${rawTime}.json`).then((res) => { if (!res.ok) throw new Error("no snapshot file"); return res.json(); });
  if (timeLabel === "평균") {
    const todaySnapshots = await Promise.all(rawTimes.map((t) => fetchOne(dateKey, t)));
    const validTimes = rawTimes.filter((t, i) => (todaySnapshots[i]?.popularKeywords || []).length > 0);
    const list = averageCm29PopularKeywords(todaySnapshots);
    const priorDates = Object.keys(cm29Index || {}).filter((d) => d < dateKey).sort();
    const priorDateKey = priorDates[priorDates.length - 1];
    if (!priorDateKey) return { list, priorList: null, validTimes };
    const priorTimes = cm29Index[priorDateKey] || [];
    const priorSnapshots = await Promise.all(priorTimes.map((t) => fetchOne(priorDateKey, t)));
    return { list, priorList: averageCm29PopularKeywords(priorSnapshots), validTimes };
  }
  const rawTime = timeLabel.replace(":", "-");
  const data = await fetchOne(dateKey, rawTime);
  const list = (data.popularKeywords || []).map((kw, i) => ({ keyword: kw, rank: i + 1 }));
  const prior = findPriorSnapshotEntry(cm29Index, dateKey, rawTime);
  if (!prior) return { list, priorList: null };
  const priorData = await fetchOne(prior.date, prior.time);
  const priorList = (priorData.popularKeywords || []).map((kw, i) => ({ keyword: kw, rank: i + 1 }));
  return { list, priorList };
}

function Cm29PopularKeywordsPanel({ cm29Index, selectedDateKey }) {
  const [mode, setMode] = useState("list");
  const [kwTime, setKwTime] = useState("평균");
  const [snapshotData, setSnapshotData] = useState({ status: "idle", list: [], priorList: null });
  const [validKwTimes, setValidKwTimes] = useState([]);
  const [trend, setTrend] = useState({ status: "idle" });
  const [trendView, setTrendView] = useState("graph");
  const [watchList, setWatchList] = useState([]); // 관심 검색어로 직접 추가한 { key, keyword } 목록
  const [watchInput, setWatchInput] = useState("");
  const [watchError, setWatchError] = useState("");

  const hasAnyData = useMemo(
    () => !!cm29Index && Object.keys(cm29Index).some((d) => (cm29Index[d] || []).length > 0),
    [cm29Index]
  );

  const availableKwTimes = validKwTimes.length ? ["평균", ...validKwTimes.map((t) => t.replace("-", ":"))] : [];

  useEffect(() => {
    if (mode !== "list" || !cm29Index || !selectedDateKey) return;
    const rawTimes = cm29Index[selectedDateKey] || [];
    if (!rawTimes.length) { setSnapshotData({ status: "empty", list: [], priorList: null }); setValidKwTimes([]); return; }
    let cancelled = false;
    setKwTime("평균");
    setSnapshotData({ status: "loading", list: [], priorList: null });
    loadCm29KeywordSnapshot(cm29Index, selectedDateKey, rawTimes, "평균")
      .then(({ list, priorList, validTimes }) => { if (!cancelled) { setSnapshotData({ status: list.length ? "ready" : "empty", list, priorList }); setValidKwTimes(validTimes || []); } })
      .catch(() => { if (!cancelled) setSnapshotData({ status: "error", list: [], priorList: null }); });
    return () => { cancelled = true; };
  }, [mode, cm29Index, selectedDateKey]);

  const onSelectKwTime = (t) => {
    const rawTimes = cm29Index?.[selectedDateKey] || [];
    setKwTime(t);
    setSnapshotData((d) => ({ ...d, status: "loading" }));
    loadCm29KeywordSnapshot(cm29Index, selectedDateKey, rawTimes, t)
      .then(({ list, priorList }) => setSnapshotData({ status: list.length ? "ready" : "empty", list, priorList }))
      .catch(() => setSnapshotData({ status: "error", list: [], priorList: null }));
  };

  useEffect(() => {
    if ((mode !== "trend" && mode !== "watch") || !cm29Index || !selectedDateKey) return;
    let cancelled = false;
    setTrend({ status: "loading" });
    loadCm29KeywordWeekTrend(cm29Index, selectedDateKey)
      .then((result) => { if (!cancelled) setTrend(result ? { status: "ready", ...result } : { status: "empty" }); })
      .catch(() => { if (!cancelled) setTrend({ status: "error" }); });
    return () => { cancelled = true; };
  }, [mode, cm29Index, selectedDateKey]);

  const addWatchKeyword = () => {
    const text = watchInput.trim();
    if (!text || trend.status !== "ready") return;
    const candidates = allKeywordCandidates(trend.perDay);
    const match = candidates.find((c) => c.keyword === text) || candidates.find((c) => c.keyword.includes(text));
    if (!match) { setWatchError("이번 주 데이터에서 찾을 수 없어요."); return; }
    setWatchError("");
    setWatchInput("");
    if (!watchList.some((w) => w.key === match.key)) setWatchList((prev) => [...prev, match]);
  };
  const removeWatchKeyword = (key) => setWatchList((prev) => prev.filter((w) => w.key !== key));

  const watchRows = useMemo(() => {
    if (trend.status !== "ready") return [];
    return watchList.map((w) => buildKeywordTrendRow(trend.perDay, w.key)).filter(Boolean);
  }, [trend, watchList]);

  if (!hasAnyData) return null;

  return (
    <div className="rounded-2xl p-5 h-full flex flex-col" style={{ background: C.white, border: `1px solid ${C.line}` }}>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div className="flex items-center gap-2">
          <Sparkles size={16} color={C.indigo} />
          <h2 className="text-base font-bold" style={{ color: C.ink }}>29CM 인기 검색어</h2>
        </div>
        <div className="flex items-center gap-2">
          {!!selectedDateKey && (<span className="text-xs font-medium whitespace-nowrap" style={{ color: C.mute }}>{selectedDateKey}</span>)}
          <button onClick={() => setMode((m) => (m === "trend" ? "list" : "trend"))} className="text-xs font-bold px-3 py-1.5 rounded-full whitespace-nowrap" style={{ background: mode === "trend" ? C.ink : C.paper, color: mode === "trend" ? C.white : C.mute, border: `1px solid ${mode === "trend" ? C.ink : C.line}` }}>최근 1주일</button>
          <button onClick={() => setMode((m) => (m === "watch" ? "list" : "watch"))} className="text-xs font-bold px-3 py-1.5 rounded-full whitespace-nowrap" style={{ background: mode === "watch" ? C.ink : C.paper, color: mode === "watch" ? C.white : C.mute, border: `1px solid ${mode === "watch" ? C.ink : C.line}` }}>관심{watchList.length ? ` (${watchList.length})` : ""}</button>
        </div>
      </div>
      {mode === "list" ? (
        <div className="flex-1 min-h-0 flex flex-col">
          {!!availableKwTimes.length && (
            <div className="flex items-center gap-1.5 mb-3 overflow-x-auto pb-1">
              {availableKwTimes.map((t) => {
                const isActive = t === kwTime;
                return (<button key={t} onClick={() => onSelectKwTime(t)} className="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap transition-colors" style={{ background: isActive ? C.ink : C.paper, color: isActive ? C.white : C.mute, border: `1px solid ${isActive ? C.ink : C.line}` }}>{t}</button>);
              })}
            </div>
          )}
          <div className="flex-1 min-h-0">
            {snapshotData.status === "loading" && (<div className="flex items-center justify-center h-full text-xs font-medium" style={{ color: C.mute }}>불러오는 중...</div>)}
            {snapshotData.status === "empty" && (<div className="flex items-center justify-center h-full text-xs font-medium" style={{ color: C.mute }}>이 시점엔 인기 검색어 데이터가 없어요.</div>)}
            {snapshotData.status === "error" && (<div className="flex items-center justify-center h-full text-xs font-medium" style={{ color: C.mute }}>인기 검색어를 불러오지 못했어요.</div>)}
            {snapshotData.status === "ready" && (
              <div className="flex flex-col gap-2">
                {[snapshotData.list.slice(0, 5), snapshotData.list.slice(5, 10)].map((rowList, ri) => (
                  <div key={ri} className="grid grid-cols-5 gap-2">
                    {rowList.map((item) => {
                      const priorIdx = snapshotData.priorList ? snapshotData.priorList.findIndex((p) => p.keyword === item.keyword) : -1;
                      const delta = !snapshotData.priorList ? undefined : priorIdx === -1 ? "NEW" : snapshotData.priorList[priorIdx].rank - item.rank;
                      return (
                        <div key={item.keyword} className="flex flex-col items-center gap-1 py-2 px-1 rounded-xl text-center" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
                          <span className="text-xs font-bold tabular-nums" style={{ color: C.mute }}>{item.rank}</span>
                          <span className="text-sm font-semibold truncate w-full" style={{ color: C.ink }}>{item.keyword}</span>
                          <CompactDelta delta={delta} />
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      ) : mode === "trend" ? (
        <div className="flex-1 min-h-0 flex flex-col">
          {(trend.status === "idle" || trend.status === "loading") && (
            <div className="flex items-center justify-center flex-1 text-xs font-medium" style={{ color: C.mute }}>불러오는 중...</div>
          )}
          {trend.status === "empty" && (
            <div className="flex items-center justify-center flex-1 text-xs font-medium" style={{ color: C.mute }}>아직 쌓인 수집일이 없어요.</div>
          )}
          {trend.status === "error" && (
            <div className="flex items-center justify-center flex-1 text-xs font-medium" style={{ color: C.mute }}>추이 데이터를 불러오지 못했어요.</div>
          )}
          {trend.status === "ready" && (
            <>
              <span className="text-xs font-medium mb-2" style={{ color: C.mute }}>인기 검색어 TOP {CM29_KEYWORD_TREND_TOP_N} 순위 추이 (최근 {trend.dates.length}개 수집일{trend.dates.length < 7 ? ", 아직 7일치 미만" : ""})</span>
              <div className="flex items-stretch p-0.5 rounded-lg mb-2 self-start" style={{ background: C.paper, border: `1px solid ${C.line}` }}>
                <button onClick={() => setTrendView("graph")} className="px-3 py-1 text-xs font-bold transition-all" style={{ background: trendView === "graph" ? C.ink : "transparent", color: trendView === "graph" ? C.white : C.mute, borderRadius: 6 }}>그래프</button>
                <button onClick={() => setTrendView("table")} className="px-3 py-1 text-xs font-bold transition-all" style={{ background: trendView === "table" ? C.ink : "transparent", color: trendView === "table" ? C.white : C.mute, borderRadius: 6 }}>표</button>
              </div>
              {trendView === "graph" ? (
                <div className="flex-1 min-h-[200px]">
                  <KeywordTrendGraph dates={trend.dates} rows={trend.rows} rankMax={CM29_KEYWORD_TREND_TOP_N} />
                </div>
              ) : (
                <div className="flex-1 min-h-0 overflow-auto">
                  <table className="w-full text-xs border-collapse">
                    <thead>
                      <tr>
                        <th className="text-left font-bold pb-2 pr-3 sticky left-0" style={{ color: C.mute, background: C.white }}>검색어</th>
                        {trend.dates.map((d) => (<th key={d} className="text-center font-semibold pb-2 px-2 whitespace-nowrap" style={{ color: C.mute }}>{d.slice(5)}</th>))}
                      </tr>
                    </thead>
                    <tbody>
                      {trend.rows.map((row) => (
                        <tr key={row.key}>
                          <td className="py-1.5 pr-3 font-semibold whitespace-nowrap sticky left-0" style={{ color: C.ink, background: C.white, borderTop: `1px solid ${C.line}` }}>{row.keyword}</td>
                          {row.ranksByDay.map((rank, i) => (
                            <td key={i} className="text-center py-1.5 px-2 tabular-nums font-bold" style={{ color: rank ? C.ink : "#D8D6D0", borderTop: `1px solid ${C.line}` }}>
                              <div className="flex flex-row items-center justify-center gap-1">
                                <span>{rank ?? "-"}</span>
                                <CompactDelta delta={row.deltasByDay[i]} />
                              </div>
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </>
          )}
        </div>
      ) : (
        <div className="flex-1 min-h-0 flex flex-col">
          {(trend.status === "idle" || trend.status === "loading") && (
            <div className="flex items-center justify-center flex-1 text-xs font-medium" style={{ color: C.mute }}>불러오는 중...</div>
          )}
          {trend.status === "empty" && (
            <div className="flex items-center justify-center flex-1 text-xs font-medium" style={{ color: C.mute }}>아직 쌓인 수집일이 없어요.</div>
          )}
          {trend.status === "error" && (
            <div className="flex items-center justify-center flex-1 text-xs font-medium" style={{ color: C.mute }}>추이 데이터를 불러오지 못했어요.</div>
          )}
          {trend.status === "ready" && (
            <>
              <span className="text-xs font-medium mb-2" style={{ color: C.mute }}>관심 검색어 순위 (최근 {trend.dates.length}개 수집일{trend.dates.length < 7 ? ", 아직 7일치 미만" : ""})</span>
              <div className="flex items-center gap-1.5 flex-wrap mb-2">
                <input
                  list="cm29-kw-watch-list"
                  value={watchInput}
                  onChange={(e) => { setWatchInput(e.target.value); setWatchError(""); }}
                  onKeyDown={(e) => { if (e.key === "Enter") addWatchKeyword(); }}
                  placeholder="관심 검색어 추가"
                  className="px-2.5 py-1 rounded-full text-xs"
                  style={{ border: `1px solid ${C.line}`, color: C.ink, width: 140 }}
                />
                <datalist id="cm29-kw-watch-list">
                  {allKeywordCandidates(trend.perDay).map((c) => (<option key={c.key} value={c.keyword} />))}
                </datalist>
                <button onClick={addWatchKeyword} className="px-3 py-1 rounded-full text-xs font-bold" style={{ background: C.paper, color: C.ink, border: `1px solid ${C.line}` }}>추가</button>
                {!!watchError && <span className="text-[11px] font-medium" style={{ color: C.signal }}>{watchError}</span>}
              </div>
              {watchRows.length === 0 ? (
                <div className="flex items-center justify-center flex-1 text-xs font-medium" style={{ background: C.paper, color: C.mute, minHeight: 160, borderRadius: 12 }}>추가한 관심 검색어가 없어요.</div>
              ) : (
                <div className="flex-1 min-h-0 overflow-auto">
                  <table className="w-full text-xs border-collapse">
                    <thead>
                      <tr>
                        <th className="text-left font-bold pb-2 pr-3 sticky left-0" style={{ color: C.mute, background: C.white }}>검색어</th>
                        {trend.dates.map((d) => (<th key={d} className="text-center font-semibold pb-2 px-2 whitespace-nowrap" style={{ color: C.mute }}>{d.slice(5)}</th>))}
                        <th className="pb-2"></th>
                      </tr>
                    </thead>
                    <tbody>
                      {watchRows.map((row) => (
                        <tr key={row.key}>
                          <td className="py-1.5 pr-3 font-semibold whitespace-nowrap sticky left-0" style={{ color: C.ink, background: C.white, borderTop: `1px solid ${C.line}` }}>{row.keyword}</td>
                          {row.ranksByDay.map((rank, i) => (
                            <td key={i} className="text-center py-1.5 px-2 tabular-nums font-bold" style={{ color: rank ? C.ink : "#D8D6D0", borderTop: `1px solid ${C.line}` }}>
                              <div className="flex flex-row items-center justify-center gap-1">
                                <span>{rank ?? "-"}</span>
                                <CompactDelta delta={row.deltasByDay[i]} />
                              </div>
                            </td>
                          ))}
                          <td className="py-1.5 pl-2" style={{ borderTop: `1px solid ${C.line}` }}>
                            <button onClick={() => removeWatchKeyword(row.key)} className="text-xs font-bold" style={{ color: C.mute }}>×</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

              <span className="text-xs font-bold" style={{ color: isActive ? C.white : C.mute }}>{item.label}</span>
            </button>
          );
        })}
      </nav>
    </>
  );
}

function FashionMarketerDashboard() {
  const [selectedDate, setSelectedDate] = useState(new Date(2026, 6, 20));
  const [view, setView] = useState("musinsa");
  const [musinsaRankings, setMusinsaRankings] = useState(MUSINSA_MOCK_RANKINGS);
  const [musinsaDataSource, setMusinsaDataSource] = useState("mock");
  const [musinsaIndex, setMusinsaIndex] = useState(null); // { "YYYY-MM-DD": ["08-00", "17-00"] } | null(로딩 전)
  const [musinsaSelectedTime, setMusinsaSelectedTime] = useState(null);

  const musinsaDates = useMemo(() => (musinsaIndex ? Object.keys(musinsaIndex).sort() : []), [musinsaIndex]);
  const selectedDateKey = useMemo(() => formatDateKey(selectedDate), [selectedDate]);
  const rawTimesForSelectedDate = musinsaIndex?.[selectedDateKey] || [];
  const availableTimesForSelectedDate = rawTimesForSelectedDate.length ? ["평균", ...rawTimesForSelectedDate.map((t) => t.replace("-", ":"))] : [];
  const panelDateLabel = selectedDateKey;

  const loadMusinsaSnapshot = (dateKey, rawTimes, timeLabel) => {
    const fetchOne = (dKey, rawTime) => fetch(`data/musinsa_${dKey}_${rawTime}.json`).then((res) => { if (!res.ok) throw new Error("no snapshot file"); return res.json(); });
    let request;
    if (timeLabel === "평균") {
      // 평균은 선택한 날짜 하루치 수집분만으로 계산하고, 순위 변동(delta)은 전일 평균 대비로 매긴다
      // (두 날짜 데이터를 하나로 뒤섞지 않고, "전일 평균" vs "당일 평균"을 각각 구해서 비교함).
      request = Promise.all(rawTimes.map((t) => fetchOne(dateKey, t))).then((todaySnapshots) => {
        const todayCategoryAvg = averageRankings(todaySnapshots);
        const priorDates = Object.keys(musinsaIndex || {}).filter((d) => d < dateKey).sort();
        const priorDateKey = priorDates[priorDates.length - 1];
        if (!priorDateKey) return todayCategoryAvg;
        const priorTimes = musinsaIndex[priorDateKey] || [];
        return Promise.all(priorTimes.map((t) => fetchOne(priorDateKey, t))).then((priorSnapshots) => {
          const priorCategoryAvg = averageRankings(priorSnapshots);
          attachAverageDelta(todayCategoryAvg, priorCategoryAvg, CATEGORIES, ["all", "rising", "new"]);
          return todayCategoryAvg;
        });
      });
    } else {
      request = fetchOne(dateKey, timeLabel.replace(":", "-"));
    }
    request
      .then((data) => { setMusinsaRankings(data); setMusinsaDataSource("live"); setMusinsaSelectedTime(timeLabel); })
      .catch(() => {});
  };

  useEffect(() => {
    fetch("data/musinsa_index.json")
      .then((res) => { if (!res.ok) throw new Error("no index file"); return res.json(); })
      .then((index) => {
        const dates = Object.keys(index || {});
        if (dates.length === 0) throw new Error("empty index");
        setMusinsaIndex(index);
        setSelectedDate(parseDateKey(dates.sort()[dates.length - 1]));
      })
      .catch(() => { setMusinsaIndex({}); setMusinsaRankings(MUSINSA_MOCK_RANKINGS); setMusinsaDataSource("mock"); });
  }, []);

  useEffect(() => {
    if (!musinsaIndex) return;
    const rawTimes = musinsaIndex[selectedDateKey];
    if (rawTimes && rawTimes.length) loadMusinsaSnapshot(selectedDateKey, rawTimes, "평균");
  }, [selectedDateKey, musinsaIndex]);

  const [cm29Rankings, setCm29Rankings] = useState({});
  const [cm29DataSource, setCm29DataSource] = useState("mock");
  const [cm29Index, setCm29Index] = useState(null);
  const [cm29SelectedTime, setCm29SelectedTime] = useState(null);

  const cm29Dates = useMemo(() => (cm29Index ? Object.keys(cm29Index).sort() : []), [cm29Index]);
  const rawTimesForSelectedDateCm29 = cm29Index?.[selectedDateKey] || [];
  const availableTimesForSelectedDateCm29 = rawTimesForSelectedDateCm29.length ? ["평균", ...rawTimesForSelectedDateCm29.map((t) => t.replace("-", ":"))] : [];

  const loadCm29Snapshot = (dateKey, rawTimes, timeLabel) => {
    const fetchOne = (dKey, rawTime) => fetch(`data/cm29_${dKey}_${rawTime}.json`).then((res) => { if (!res.ok) throw new Error("no snapshot file"); return res.json(); });
    let request;
    if (timeLabel === "평균") {
      request = Promise.all(rawTimes.map((t) => fetchOne(dateKey, t))).then((todaySnapshots) => {
        const todayAvg = averageCm29Rankings(todaySnapshots);
        const priorDates = Object.keys(cm29Index || {}).filter((d) => d < dateKey).sort();
        const priorDateKey = priorDates[priorDates.length - 1];
        if (!priorDateKey) return todayAvg;
        const priorTimes = cm29Index[priorDateKey] || [];
        return Promise.all(priorTimes.map((t) => fetchOne(priorDateKey, t))).then((priorSnapshots) => {
          const priorAvg = averageCm29Rankings(priorSnapshots);
          Object.keys(todayAvg).forEach((largeCat) => {
            const subCats = Object.keys(todayAvg[largeCat]);
            const periodsSet = new Set();
            subCats.forEach((sc) => Object.keys(todayAvg[largeCat][sc] || {}).forEach((p) => periodsSet.add(p)));
            attachAverageDelta(todayAvg[largeCat], priorAvg[largeCat] || {}, subCats, [...periodsSet]);
          });
          return todayAvg;
        });
      });
    } else {
      request = fetchOne(dateKey, timeLabel.replace(":", "-"));
    }
    request
      .then((data) => { setCm29Rankings(data); setCm29DataSource("live"); setCm29SelectedTime(timeLabel); })
      .catch(() => {});
  };

  useEffect(() => {
    fetch("data/cm29_index.json")
      .then((res) => { if (!res.ok) throw new Error("no index file"); return res.json(); })
      .then((index) => {
        const dates = Object.keys(index || {});
        if (dates.length === 0) throw new Error("empty index");
        setCm29Index(index);
      })
      .catch(() => { setCm29Index({}); });
  }, []);

  useEffect(() => {
    if (!cm29Index) return;
    const rawTimes = cm29Index[selectedDateKey];
    if (rawTimes && rawTimes.length) loadCm29Snapshot(selectedDateKey, rawTimes, "평균");
  }, [selectedDateKey, cm29Index]);

  const [scrapeStatus, setScrapeStatus] = useState({ state: "idle", message: "" });

  const triggerScrape = () => {
    setScrapeStatus({ state: "loading", message: "" });
    fetch("https://fashion-pulse-scrape-trigger.rankinginsta.workers.dev", { method: "POST" })
      .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        setScrapeStatus({ state: ok && data.ok ? "success" : "error", message: data.message || "요청 실패" });
      })
      .catch(() => setScrapeStatus({ state: "error", message: "요청을 보내지 못했어요." }));
  };

  const lastScrapedLabel = useMemo(() => {
    const candidates = [];
    if (musinsaDates.length) {
      const d = musinsaDates[musinsaDates.length - 1];
      const times = musinsaIndex?.[d] || [];
      if (times.length) candidates.push(`${d} ${times[times.length - 1].replace("-", ":")}`);
    }
    if (cm29Dates.length) {
      const d = cm29Dates[cm29Dates.length - 1];
      const times = cm29Index?.[d] || [];
      if (times.length) candidates.push(`${d} ${times[times.length - 1].replace("-", ":")}`);
    }
    if (!candidates.length) return null;
    return candidates.sort().slice(-1)[0];
  }, [musinsaDates, musinsaIndex, cm29Dates, cm29Index]);

  const meta = PAGE_META[view];

  return (
    <div className="min-h-screen w-full flex" style={{ background: C.paper }}>
      <Sidebar active={view} onChange={setView} />
      <div className="flex-1 min-w-0 flex flex-col">
        <header className="px-6 pt-6 pb-4">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div>
              <h1 className="font-display text-xl font-bold leading-none" style={{ color: C.ink }}>{meta.title}</h1>
              <p className="text-xs font-medium mt-1.5" style={{ color: C.mute }}>{meta.subtitle}</p>
            </div>
            <div className="flex flex-col items-end">
              <div className="flex items-center gap-2 flex-wrap justify-end">
                {scrapeStatus.state === "success" && (<span className="text-xs font-semibold" style={{ color: "#1E8E5A" }}>{scrapeStatus.message}</span>)}
                {scrapeStatus.state === "error" && (<span className="text-xs font-semibold" style={{ color: C.signal }}>{scrapeStatus.message}</span>)}
                <button onClick={triggerScrape} disabled={scrapeStatus.state === "loading"} className="px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap" style={{ background: C.ink, color: C.white, opacity: scrapeStatus.state === "loading" ? 0.6 : 1, cursor: scrapeStatus.state === "loading" ? "not-allowed" : "pointer" }}>
                  {scrapeStatus.state === "loading" ? "요청 중..." : "지금 스크랩하기"}
                </button>
              </div>
              {!!lastScrapedLabel && (<span className="text-[12px] mt-1" style={{ color: C.mute }}>마지막 수집: {lastScrapedLabel}</span>)}
            </div>
          </div>
        </header>
        <main className="px-6 py-5 flex flex-col gap-5">
          {view === "musinsa" && (
            <>
              <div className="grid grid-cols-1 lg:grid-cols-[2fr_1fr] gap-5 items-stretch">
                <KeywordRankingPanel dataSource={musinsaDataSource} selectedDateLabel={panelDateLabel} musinsaIndex={musinsaIndex} selectedDateKey={selectedDateKey} />
                <MiniCalendar selected={selectedDate} onSelect={setSelectedDate} availableDates={musinsaDates} />
              </div>
              <RankingPanel
                rankings={musinsaRankings}
                title="무신사 랭킹 TOP 150"
                dataSource={musinsaDataSource}
                selectedDateLabel={panelDateLabel}
                availableTimes={availableTimesForSelectedDate}
                selectedTime={musinsaSelectedTime}
                onSelectTime={(t) => loadMusinsaSnapshot(selectedDateKey, musinsaIndex?.[selectedDateKey] || [], t)}
              />
            </>
          )}
          {view === "cm29" && (
            <>
              <div className="grid grid-cols-1 lg:grid-cols-[2fr_1fr] gap-5 items-stretch">
                <Cm29PopularKeywordsPanel cm29Index={cm29Index} selectedDateKey={selectedDateKey} />
                <MiniCalendar selected={selectedDate} onSelect={setSelectedDate} availableDates={cm29Dates} />
              </div>
              <Cm29RankingPanel
                rankings={cm29Rankings}
                title="29CM 랭킹 TOP 100"
                dataSource={cm29DataSource}
                selectedDateLabel={selectedDateKey}
                availableTimes={availableTimesForSelectedDateCm29}
                selectedTime={cm29SelectedTime}
                onSelectTime={(t) => loadCm29Snapshot(selectedDateKey, cm29Index?.[selectedDateKey] || [], t)}
              />
            </>
          )}
          {view === "instagram" && <InstagramTimeline />}
        </main>
        <footer className="text-center text-[11px] py-4" style={{ color: C.mute }}>ⓘ 무신사 랭킹은 {musinsaDataSource === "live" ? `${panelDateLabel} ${musinsaSelectedTime} 수집분(실시간 데이터)` : "수집 파일을 찾지 못해 표시 중인 샘플(목업) 데이터"}입니다. 29CM 및 키워드/인스타그램 지표는 목업(더미) 데이터입니다.</footer>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FashionMarketerDashboard />);
</script>
</body>
</html>
