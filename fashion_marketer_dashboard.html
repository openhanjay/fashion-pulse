function seeded(seed) {
  const x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

};

const MOCK_TOP_N = 150;

function generateRanking(category, catIdx, brandsList, seedBase) {
  const pool = PRODUCT_POOL[category];
  return Array.from({ length: MOCK_TOP_N }, (_, i) => {
    const seed = seedBase + catIdx * 977 + i * 13 + 1;
    const brand = brandsList[Math.floor(seeded(seed) * brandsList.length)];
    const name = pool[(i + catIdx) % pool.length];
    const price = Math.round(((19000 + seeded(seed + 1) * 170000) / 1000)) * 1000;
    const roll = seeded(seed + 2);
    let delta;
    if (i < 5 && roll > 0.72) delta = "NEW";
    else delta = Math.round((seeded(seed + 3) - 0.45) * 26);
    return { rank: i + 1, brand, name, price, delta };
  });
}

function buildPlatformRankings(brandsList, seedBase) {
  return Object.fromEntries(CATEGORIES.map((c, idx) => [c, generateRanking(c, idx, brandsList, seedBase)]));
}

/* 목업 랭킹(단일 리스트 + delta)을 실데이터와 동일한 { all, rising, new } 구조로 변환 */
function toFilteredRankings(rawRankings) {
  return Object.fromEntries(CATEGORIES.map((c) => {
    const list = rawRankings[c];
    return [c, {
      all: list,
      rising: list.filter((item) => typeof item.delta === "number" && item.delta > 0),
      new: list.filter((item) => item.delta === "NEW"),
    }];
  }));
}

/* Date -> "YYYY-MM-DD" (수집 인덱스/파일명 키와 맞춤) */
function formatDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function parseDateKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}

/* 하루 여러 번 수집한 스냅샷들을 상품별 평균 순위로 합쳐서 하나의 { all, rising, new } 랭킹으로 재구성 */
function averageRankings(snapshots) {
  const result = {};
  CATEGORIES.forEach((cat) => {
    result[cat] = {};
    ["all", "rising", "new"].forEach((filterKey) => {
      const merged = new Map();
      snapshots.forEach((snap) => {
        const list = snap?.[cat]?.[filterKey] || [];
        list.forEach((item) => {
          const key = item.url || `${item.brand}__${item.name}`;
          const existing = merged.get(key);
          if (existing) {
            existing.sumRank += item.rank;
            existing.count += 1;
            existing.latest = item;
          } else {
            merged.set(key, { sumRank: item.rank, count: 1, latest: item });
          }
        });
      });
      result[cat][filterKey] = [...merged.values()]
        .map((v) => ({ ...v.latest, avgRank: v.sumRank / v.count }))
        .sort((a, b) => a.avgRank - b.avgRank)
        .slice(0, 100)
        .map((item, idx) => ({ ...item, rank: idx + 1 }));
    });
  });
  return result;
}

const DATA_START = new Date(2026, 0, 1);
const DATA_END = new Date(2026, 6, 20);
const MS_PER_DAY = 86400000;
const TOTAL_DAYS = Math.round((DATA_END - DATA_START) / MS_PER_DAY) + 1;

function dayIndex(date) { return Math.round((date - DATA_START) / MS_PER_DAY); }

function buildTrendSeries(keywords, seedBase) {
  const map = {};
  keywords.forEach((kw, ki) => {
    let v = 400 + seeded(seedBase + ki * 51 + 3) * 1400;
    const arr = [];
    for (let d = 0; d < TOTAL_DAYS; d++) {
      const shift = (seeded(seedBase + ki * 91 + d * 7 + 1) - 0.5) * 220;
      v = Math.max(80, v + shift);
      arr.push(Math.round(v));
    }
    map[kw] = arr;
  });
  return map;
}

function buildChartData(selectedKeys, start, end, seriesMap) {
  const days = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) days.push(new Date(d));
  return days.map((d) => {
    const idx = dayIndex(d);
    const row = { day: `${d.getMonth() + 1}/${d.getDate()}` };
    selectedKeys.forEach((kw) => { row[kw] = seriesMap[kw][idx]; });
    return row;
  });
}

const TREND_YEARS = [2026];

const WEEK_LABELS = ["첫째주", "둘째주", "셋째주", "넷째주", "다섯째주"];

function daysAvailableInMonth(year, month) {
  const daysInMonth = new Date(year, month, 0).getDate();
  if (year === DATA_END.getFullYear() && month === DATA_END.getMonth() + 1) {
    return Math.min(daysInMonth, DATA_END.getDate());
  }
  return daysInMonth;
}

function getWeeksForMonth(year, month) {
  const totalDays = daysAvailableInMonth(year, month);
  const weeks = [];
  let start = 1, wi = 0;
  while (start <= totalDays) {
    const end = Math.min(start + 6, totalDays);
    weeks.push({ key: `w${wi + 1}`, label: WEEK_LABELS[wi] || `${wi + 1}주차`, startDay: start, endDay: end });
    start = end + 1; wi++;
  }
  return weeks;
}

/* ============================== 커스텀 미니 라인차트 (recharts 대체) ============================== */
function MiniLineChart({ data, lines }) {
  const width = 700, height = 240;
  const padL = 40, padR = 10, padT = 10, padB = 26;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;
  const values = [];
  data.forEach((d) => lines.forEach((l) => { if (typeof d[l.key] === "number") values.push(d[l.key]); }));
  const minV = values.length ? Math.min(...values) : 0;
  const maxV = values.length ? Math.max(...values) : 1;
  const range = maxV - minV || 1;
  const n = data.length;
  const xFor = (i) => padL + (n > 1 ? (i / (n - 1)) * innerW : innerW / 2);
  const yFor = (v) => padT + innerH - ((v - minV) / range) * innerH;
  const gridYs = [0, 0.25, 0.5, 0.75, 1].map((t) => padT + innerH * (1 - t));
  const labelEvery = Math.max(1, Math.ceil(n / 7));

  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height="100%" preserveAspectRatio="none">
      {gridYs.map((y, i) => (<line key={i} x1={padL} x2={width - padR} y1={y} y2={y} stroke={C.line} strokeDasharray="3 5" />))}
      {data.map((d, i) => (i % labelEvery === 0 ? (<text key={i} x={xFor(i)} y={height - 6} fontSize="10" fill={C.mute} textAnchor="middle">{d.day}</text>) : null))}
      {lines.map((l) => {
        const pts = data.map((d, i) => `${xFor(i)},${yFor(d[l.key] ?? minV)}`).join(" ");
        return <polyline key={l.key} points={pts} fill="none" stroke={l.color} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round" />;
      })}
    </svg>
  );
}

function KeywordTrendPanel({ keywords, series }) {
  const [active, setActive] = useState(new Set([keywords[0], keywords[1], keywords[3]]));
  const [mode, setMode] = useState("recent");
  const [year, setYear] = useState(2026);
  const [month, setMonth] = useState(7);
  const weeks = useMemo(() => getWeeksForMonth(year, month), [year, month]);
  const [weekKey, setWeekKey] = useState(weeks[weeks.length - 1]?.key);

  const toggle = (kw) => {
    setActive((prev) => {
      const next = new Set(prev);
      if (next.has(kw)) { if (next.size > 1) next.delete(kw); } else next.add(kw);
      return next;
    });
  };

  const handleMonthChange = (nextMonth) => {
    setMonth(nextMonth);
    const nextWeeks = getWeeksForMonth(year, nextMonth);
    setWeekKey(nextWeeks[nextWeeks.length - 1]?.key);
    setMode("week");
  };

  const { data, rangeLabel } = useMemo(() => {
    if (mode === "recent") {
      const start = new Date(DATA_END);
      start.setDate(start.getDate() - 13);
      return { data: buildChartData([...active], start, DATA_END, series), rangeLabel: `최근 14일 (${start.getMonth() + 1}/${start.getDate()} ~ ${DATA_END.getMonth() + 1}/${DATA_END.getDate()})` };
    }
    const w = weeks.find((w) => w.key === weekKey) || weeks[weeks.length - 1];
    if (!w) return { data: [], rangeLabel: "데이터 없음" };
    const start = new Date(year, month - 1, w.startDay);
    const end = new Date(year, month - 1, w.endDay);
    return { data: buildChartData([...active], start, end, series), rangeLabel: `${year}.${String(month).padStart(2, "0")} ${w.label} (${month}/${w.startDay} ~ ${month}/${w.endDay})` };
  }, [active, mode, weeks, weekKey, year, month, series]);

  const lines = keywords.map((kw, ki) => (active.has(kw) ? { key: kw, color: LINE_PALETTE[ki] } : null)).filter(Boolean);

  return (
    <div className="rounded-2xl p-5 h-full flex flex-col" style={{ background: C.white, border: `1px solid ${C.line}` }}>
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <div className="flex items-center gap-2">
          <Sparkles size={16} color={C.indigo} />
          <h2 className="text-base font-bold" style={{ color: C.ink }}>키워드 검색량 추이</h2>
        </div>
        <div className="flex items-center gap-1.5 flex-wrap">
          <select value={year} onChange={(e) => { setYear(Number(e.target.value)); setMode("week"); }} className="text-xs font-bold px-2.5 py-1.5 rounded-full cursor-pointer" style={{ background: mode === "week" ? C.paper : C.white, color: C.ink, border: `1px solid ${C.line}` }}>
            {TREND_YEARS.map((y) => (<option key={y} value={y}>{y}년</option>))}
          </select>
          <select value={month} onChange={(e) => handleMonthChange(Number(e.target.value))} className="text-xs font-bold px-2.5 py-1.5 rounded-full cursor-pointer" style={{ background: mode === "week" ? C.paper : C.white, color: C.ink, border: `1px solid ${C.line}` }}>
            {TREND_MONTHS.map((m) => (<option key={m} value={m}>{m}월</option>))}
          </select>
          <select value={weekKey} onChange={(e) => { setWeekKey(e.target.value); setMode("week"); }} className="text-xs font-bold px-2.5 py-1.5 rounded-full cursor-pointer" style={{ background: mode === "week" ? C.paper : C.white, color: C.ink, border: `1px solid ${C.line}` }}>
            {weeks.map((w) => (<option key={w.key} value={w.key}>{w.label}</option>))}
          </select>
          <button onClick={() => setMode("recent")} className="text-xs font-bold px-3 py-1.5 rounded-full whitespace-nowrap" style={{ background: mode === "recent" ? C.ink : C.paper, color: mode === "recent" ? C.white : C.mute, border: `1px solid ${mode === "recent" ? C.ink : C.line}` }}>최근 14일</button>
        </div>
      </div>
      <span className="text-xs font-medium" style={{ color: C.mute }}>마케터 지정 키워드 · {rangeLabel}</span>
      <div className="flex flex-wrap gap-1.5 my-3">
        {keywords.map((kw, ki) => {
          const isActive = active.has(kw);
          return (
            <button key={kw} onClick={() => toggle(kw)} className="px-2.5 py-1 rounded-full text-xs font-semibold transition-opacity" style={{ background: isActive ? `${LINE_PALETTE[ki]}1A` : C.paper, color: isActive ? LINE_PALETTE[ki] : C.mute, border: `1px solid ${isActive ? LINE_PALETTE[ki] + "55" : C.line}` }}>{kw}</button>
          );
        })}
      </div>
      <div className="flex-1 min-h-[220px]">
        <MiniLineChart data={data} lines={lines} />
      </div>
    </div>
  );
}

function DeltaBadge({ delta }) {
  if (delta === "NEW") return (<span className="text-[10px] font-bold px-1.5 py-0.5 rounded" style={{ background: C.signal, color: C.white }}>NEW</span>);
  if (delta > 0) return (<span className="flex items-center gap-0.5 text-[11px] font-bold" style={{ color: "#1E8E5A" }}><TrendingUp size={11} /> {delta}</span>);
  if (delta < 0) return (<span className="flex items-center gap-0.5 text-[11px] font-bold" style={{ color: C.signal }}><TrendingDown size={11} /> {Math.abs(delta)}</span>);
  return (<span className="flex items-center gap-0.5 text-[11px] font-semibold" style={{ color: C.mute }}><Minus size={11} /> 0</span>);
}

function FashionMarketerDashboard() {
  const [selectedDate, setSelectedDate] = useState(new Date(2026, 6, 20));

  const [musinsaDataSource, setMusinsaDataSource] = useState("mock");
  const [musinsaIndex, setMusinsaIndex] = useState(null); // { "YYYY-MM-DD": ["08-00", "17-00"] } | null(로딩 전)
  const [musinsaSelectedTime, setMusinsaSelectedTime] = useState(null);

  const musinsaDates = useMemo(() => (musinsaIndex ? Object.keys(musinsaIndex).sort() : []), [musinsaIndex]);
  const selectedDateKey = useMemo(() => formatDateKey(selectedDate), [selectedDate]);
  const rawTimesForSelectedDate = musinsaIndex?.[selectedDateKey] || [];
  const availableTimesForSelectedDate = rawTimesForSelectedDate.length ? ["평균", ...rawTimesForSelectedDate.map((t) => t.replace("-", ":"))] : [];

  const loadMusinsaSnapshot = (dateKey, rawTimes, timeLabel) => {
    const fetchOne = (rawTime) => fetch(`data/musinsa_${dateKey}_${rawTime}.json`).then((res) => { if (!res.ok) throw new Error("no snapshot file"); return res.json(); });
    const request = timeLabel === "평균"
      ? Promise.all(rawTimes.map(fetchOne)).then((snapshots) => averageRankings(snapshots))
      : fetchOne(timeLabel.replace(":", "-"));
    request
      .then((data) => { setMusinsaRankings(data); setMusinsaDataSource("live"); setMusinsaSelectedTime(timeLabel); })
      .catch(() => {});
  };

  useEffect(() => {
    fetch("data/musinsa_index.json")
      .then((res) => { if (!res.ok) throw new Error("no index file"); return res.json(); })
      .then((index) => {
        const dates = Object.keys(index || {});
        if (dates.length === 0) throw new Error("empty index");
        setMusinsaIndex(index);
        setSelectedDate(parseDateKey(dates.sort()[dates.length - 1]));
      })
      .catch(() => { setMusinsaIndex({}); setMusinsaRankings(MUSINSA_MOCK_RANKINGS); setMusinsaDataSource("mock"); });
  }, []);

  useEffect(() => {
    if (!musinsaIndex) return;
    const rawTimes = musinsaIndex[selectedDateKey];
    if (rawTimes && rawTimes.length) loadMusinsaSnapshot(selectedDateKey, rawTimes, "평균");
  }, [selectedDateKey, musinsaIndex]);

  const meta = PAGE_META[view];

  return (
    <div className="min-h-screen w-full flex" style={{ background: C.paper }}>
      <Sidebar active={view} onChange={setView} />
      <div className="flex-1 min-w-0 flex flex-col">

          <div className="flex items-center justify-between flex-wrap gap-3">

              <h1 className="font-display text-xl font-bold leading-none" style={{ color: C.ink }}>{meta.title}</h1>
              <p className="text-xs font-medium mt-1.5" style={{ color: C.mute }}>{meta.subtitle}</p>
            </div>
            <div className="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold" style={{ background: C.white, color: C.ink, border: `1px solid ${C.line}` }}>
              <span className="rounded-full" style={{ width: 6, height: 6, background: "#1E8E5A" }} />
              2026.07.20 (월) 기준 데이터
            </div>
          </div>
        </header>
        {view !== "instagram" && (<Ticker keywords={view === "cm29" ? REALTIME_KEYWORDS_CM29 : REALTIME_KEYWORDS_MUSINSA} />)}
        <main className="px-6 py-5 flex flex-col gap-5">
          {view === "musinsa" && (
            <>
              <div className="grid grid-cols-1 lg:grid-cols-[2fr_1fr] gap-5 items-stretch">
                <KeywordTrendPanel key="musinsa-keyword" keywords={MARKETER_KEYWORDS_MUSINSA} series={MUSINSA_TREND_SERIES} />
                <MiniCalendar selected={selectedDate} onSelect={setSelectedDate} availableDates={musinsaDates} />
              </div>
              <RankingPanel
                rankings={musinsaRankings}
                title="무신사 랭킹 TOP 100"
                dataSource={musinsaDataSource}
                selectedDateLabel={selectedDateKey}
                availableTimes={availableTimesForSelectedDate}
                selectedTime={musinsaSelectedTime}
                onSelectTime={(t) => loadMusinsaSnapshot(selectedDateKey, musinsaIndex?.[selectedDateKey] || [], t)}
              />
            </>
          )}
          {view === "cm29" && (
            <>
              <div className="grid grid-cols-1 lg:grid-cols-[2fr_1fr] gap-5 items-stretch">
                <KeywordTrendPanel key="cm29-keyword" keywords={MARKETER_KEYWORDS_CM29} series={CM29_TREND_SERIES} />
                <MiniCalendar selected={selectedDate} onSelect={setSelectedDate} />
              </div>
              <RankingPanel rankings={CM29_RANKINGS} title="29CM 랭킹 TOP 100" dataSource="mock" />
            </>
          )}
          {view === "instagram" && <InstagramTimeline />}
        </main>
        <footer className="text-center text-[11px] py-4" style={{ color: C.mute }}>ⓘ 무신사 랭킹은 {musinsaDataSource === "live" ? `${selectedDateKey} ${musinsaSelectedTime} 수집분(실시간 데이터)` : "수집 파일을 찾지 못해 표시 중인 샘플(목업) 데이터"}입니다. 29CM 및 키워드/인스타그램 지표는 목업(더미) 데이터입니다.</footer>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FashionMarketerDashboard />);
</script>
</body>
</html>
