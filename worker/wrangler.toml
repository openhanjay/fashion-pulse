name = "fashion-pulse-scrape-trigger"
main = "index.js"
compatibility_date = "2026-07-28"

kv_namespaces = [
  { binding = "RATE_LIMIT_KV", id = "2945a69b0c7b4c5bb54bae247dbc0078" }
]

[triggers]
# 08 / 12 / 16 / 20 / 24시 KST (UTC+9이라 UTC로는 23, 3, 7, 11, 15시).
# 시각마다 한 줄씩 쓰면 cron 트리거를 5개 쓰게 되는데, Workers 무료 플랜은 계정당 5개가 한도라
# 다른 Worker가 하나라도 쓰면 배포가 실패한다(실제로 10072 오류로 막혔다).
# 한 줄에 시각을 나열하면 트리거 1개만 쓰면서 같은 일정이 된다.
crons = ["0 23,3,7,11,15 * * *"]
